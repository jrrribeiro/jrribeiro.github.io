---
layout: default
---
<article class="page">
  <header class="page-header page-hero">
    {% if page.eyebrow %}
      <p class="eyebrow">{{ page.eyebrow }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% assign page_intro = page.intro | default: page.lead | default: page.description %}
    {% if page_intro %}
      <p class="page-intro">{{ page_intro }}</p>
    {% endif %}
  </header>

  <div class="page-body">
    {{ content }}
  </div>
</article>
