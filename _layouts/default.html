<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#103c2c">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/images/conectaves-symbol.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=4">
    <link rel="stylesheet" href="{{ '/assets/css/concept.css' | relative_url }}?v=3">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }} | ConectAves">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:image" content="{{ '/assets/images/conectaves-full.png' | absolute_url }}">
    <title>{% if page.nav_key == 'home' %}ConectAves | Ecologia integrativa e conservação de aves{% else %}{{ page.title | escape }} | ConectAves{% endif %}</title>
    <script src="{{ '/assets/js/site.js' | relative_url }}?v=3" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    {% include header.html %}
    <main id="conteudo">{{ content }}</main>
    {% include footer.html %}
  </body>
</html>
